<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <!-- Inner Glow Ring -->
  <rect x="20" y="20" width="472" height="472" rx="90" fill="none" stroke="#10b981" stroke-width="6" opacity="0.4" />
  
  <!-- Therapeutic Hands & Cupping Glass Emblem -->
  <g transform="translate(256, 240)" text-anchor="middle">
    <!-- Cupping Glass Contour -->
    <path d="M -70 -70 C -70 -130, 70 -130, 70 -70 C 70 -20, 90 20, 80 50 C 70 80, -70 80, -80 50 C -90 20, -70 -20, -70 -70 Z" 
          fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Cupping Vacuum Valve -->
    <rect x="-24" y="-135" width="48" height="25" rx="8" fill="#f59e0b" stroke="#ffffff" stroke-width="6"/>
    
    <!-- Energy Spark / Sunnah Healing Glow -->
    <circle cx="0" cy="-20" r="30" fill="url(#accentGrad)" opacity="0.85"/>
    <path d="M 0 -45 L 0 5 M -25 -20 L 25 -20 M -18 -38 L 18 -2" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>

    <!-- Gentle Care Hands Arc below -->
    <path d="M -130 90 C -60 140, 60 140, 130 90" fill="none" stroke="#34d399" stroke-width="16" stroke-linecap="round"/>
    <path d="M -150 65 C -80 125, 80 125, 150 65" fill="none" stroke="#6ee7b7" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
  </g>
  
  <!-- Subtitle Text -->
  <text x="256" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    TERAPIS BEKAM
  </text>
</svg>
